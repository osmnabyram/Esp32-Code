<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ESP32-S3 firmware driving Wi-Fi and BLE offensive modules for authorized testing.">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#1c0708"/><stop offset="55%" stop-color="#0c0304"/><stop offset="100%" stop-color="#050203"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity="0"/><stop offset="0.5" stop-color="#ff5a5a"/><stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ff2d2d" stroke-opacity="0.055" stroke-width="1"/></pattern>
  </defs>
  <style>
    .t{fill:#f3e7e7}.m{fill:#bd8d8d}.r{fill:#ff4747}
    .title{font-size:12px;font-weight:700;letter-spacing:3px}
    .lbl{font-size:14px;font-weight:700}.sub{font-size:10.5px;letter-spacing:.3px}
    .mono{font-family:Consolas,monospace;font-size:11.5px}
    .ln{stroke:#4a2326;stroke-width:1.5;fill:none}
    .flow{stroke:url(#flow);stroke-width:2.6;fill:none;stroke-dasharray:9 9;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-18}}
    .rise{opacity:0;animation:rise .7s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .frame{stroke-dasharray:14 10;animation:fr 7s linear infinite}
    @keyframes fr{to{stroke-dashoffset:-48}}
    .scan{animation:scan 4.8s ease-in-out infinite}
    @keyframes scan{0%{transform:translateY(32px);opacity:0}8%{opacity:.55}52%{transform:translateY(300px);opacity:.55}60%{opacity:0}100%{opacity:0}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spins{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite reverse}
    .blink{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    .flick{animation:flick 3.2s ease-in-out infinite}
    @keyframes flick{0%,47%,100%{opacity:1}48%{opacity:.35}49%{opacity:1}91%{opacity:.55}92%{opacity:1}}
    .pk{opacity:0;animation:pk 2.6s linear infinite}
    @keyframes pk{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{transform:translateX(118px);opacity:1}100%{transform:translateX(118px);opacity:0}}
    .type{clip-path:inset(0 100% 0 0);animation:type 5.2s ease-in-out infinite}
    @keyframes type{0%,8%{clip-path:inset(0 100% 0 0)}46%{clip-path:inset(0 0 0 0)}92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:bar 1.1s ease-in-out infinite}
    @keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw 3.4s ease-in-out infinite}
    @keyframes draw{0%,40%{stroke-dashoffset:30}60%{stroke-dashoffset:0}92%{stroke-dashoffset:0}100%{stroke-dashoffset:30}}
</style>
  <rect width="880" height="340" fill="url(#bg)"/>
  <rect width="880" height="340" fill="url(#grid)"/>
  <rect class="frame" x="7" y="7" width="866" height="326" rx="16" fill="none" stroke="#ff2d2d" stroke-opacity="0.5" stroke-width="1.4"/>
  <g class="scan"><rect x="9" y="0" width="862" height="2" fill="#ff3b3b" opacity="0.5" filter="url(#glow)"/></g>
  <text x="440" y="40" text-anchor="middle" class="title r flick" filter="url(#glow)">ESP32-S3 OFFENSIVE FIRMWARE</text>
  <g class="rise" style="animation-delay:0.0s"><rect x="40" y="118" width="200" height="84" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/><circle cx="56" cy="136" r="3.2" class="r pulse" filter="url(#glow)"/><text x="58" y="158" class="lbl t">ESP32-S3</text><text x="58" y="176" class="sub m">firmware core</text></g>
  <path class="flow" d="M240 136 H330"/>
  <path class="flow" d="M240 236 H330"/>
  <g class="rise" style="animation-delay:0.12s"><rect x="330" y="96" width="220" height="70" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/><circle cx="346" cy="114" r="3.2" class="r pulse" filter="url(#glow)"/><text x="378" y="128" class="lbl t">Wi-Fi</text><text x="378" y="146" class="sub m">sniff / deauth / portal</text></g>
  <g filter="url(#glow)"><circle cx="352" cy="132" r="3.2" class="r"/><path class="flick" style="animation-delay:0.0s" d="M342 132 A10 10 0 0 1 362 132" fill="none" stroke="#ff4747" stroke-width="2" transform="rotate(-90 352 132)"/><path class="flick" style="animation-delay:0.25s" d="M335 132 A17 17 0 0 1 369 132" fill="none" stroke="#ff4747" stroke-width="2" transform="rotate(-90 352 132)"/><path class="flick" style="animation-delay:0.5s" d="M328 132 A24 24 0 0 1 376 132" fill="none" stroke="#ff4747" stroke-width="2" transform="rotate(-90 352 132)"/></g>
  <g class="rise" style="animation-delay:0.24s"><rect x="330" y="196" width="220" height="70" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/><circle cx="346" cy="214" r="3.2" class="r pulse" filter="url(#glow)"/><text x="378" y="228" class="lbl t">BLE</text><text x="378" y="246" class="sub m">spam / quiet scan</text></g>
  <g filter="url(#glow)"><line x1="352" y1="231" x2="334" y2="221" stroke="#ff4747" stroke-width="1.3" opacity="0.6"/><line x1="352" y1="231" x2="370" y2="221" stroke="#ff4747" stroke-width="1.3" opacity="0.6"/><line x1="352" y1="231" x2="336" y2="243" stroke="#ff4747" stroke-width="1.3" opacity="0.6"/><line x1="352" y1="231" x2="368" y2="243" stroke="#ff4747" stroke-width="1.3" opacity="0.6"/><circle cx="334" cy="221" r="3.4" class="r pulse" style="animation-delay:0.0s"/><circle cx="370" cy="221" r="3.4" class="r pulse" style="animation-delay:0.3s"/><circle cx="336" cy="243" r="3.4" class="r pulse" style="animation-delay:0.6s"/><circle cx="368" cy="243" r="3.4" class="r pulse" style="animation-delay:0.8999999999999999s"/><circle cx="352" cy="231" r="6" class="r"/></g>
  <g class="rise" style="animation-delay:0.36s"><rect x="620" y="146" width="220" height="70" rx="12" fill="#12080a" stroke="#ff2d2d" stroke-opacity="0.55" stroke-width="1.4"/><circle cx="636" cy="164" r="3.2" class="r pulse" filter="url(#glow)"/><text x="690" y="178" class="lbl t">CAPTURE</text><text x="690" y="196" class="sub m">PCAP / SD / web UI</text></g>
  <g filter="url(#glow)"><circle cx="665" cy="181" r="20" fill="none" stroke="#ff4747" stroke-width="1.6"/><circle cx="665" cy="181" r="11" fill="none" stroke="#ff4747" stroke-width="1.2" opacity="0.6"/><path class="spin" d="M665 181 L665 161 A20 20 0 0 1 681 169 Z" fill="#ff4747" opacity="0.35"/><circle cx="673" cy="174" r="2.4" class="r pulse"/><circle cx="659" cy="190" r="2.4" class="r pulse" style="animation-delay:.6s"/></g>
  <path class="flow" d="M550 160 H620"/>
  <g transform="translate(60,262)"><rect x="-6" y="-16" width="20" height="20" rx="3" fill="none" stroke="#ff2d2d" stroke-opacity="0.5"/><text x="-2" y="-1" class="mono r blink">&gt;</text><text x="24" y="-1" class="mono m type">authorized wireless testing only</text></g>
</svg>
